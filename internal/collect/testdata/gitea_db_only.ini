; Gitea app.ini that is fully configured (DB-only), but lacks INSTALL_LOCK.
; A correctly installed gitea may omit INSTALL_LOCK (it defaults to false in
; Gitea's own defaults, but Keelix must not fire SVC031 when it's simply absent
; from the file — the operator may have installed via ENV or the key was stripped.
[database]
DB_TYPE = postgres
HOST    = db:5432
NAME    = gitea
USER    = gitea

[server]
DOMAIN   = git.example.com
ROOT_URL = https://git.example.com/

[service]
DISABLE_REGISTRATION = true
