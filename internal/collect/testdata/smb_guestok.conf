[global]
   workgroup = WORKGROUP
   server string = Samba Server
   security = user
   map to guest = bad user

[media]
   path = /srv/media
   browseable = yes
   read only = no
   guest ok = yes
   create mask = 0664
   directory mask = 0775

[private]
   path = /srv/private
   browseable = no
   valid users = alice
   read only = no
