# Redis service with a dangerous open configuration:
# - port published to all interfaces (no 127.0.0.1 bind)
# - config.conf bind-mounted from host
version: "3.8"
services:
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
