name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (echo "Run gofmt -w ."; gofmt -l .; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Self-scan demo (must flag the vulnerable stack)
        run: ./dist/keelix scan -c testdata/vulnerable/docker-compose.yml --firewall testdata/vulnerable/ufw.txt --no-probe --no-color
      - name: Linux whole-box quickstart smoke (inside-out collectors must run, not crash)
        run: |
          set +e
          ./dist/keelix scan --no-color > /tmp/qs.out 2>/tmp/qs.err
          echo "=== exit $? ==="
          echo "----- stdout -----"; cat /tmp/qs.out
          echo "----- stderr -----"; cat /tmp/qs.err
          if grep -qiE 'panic|runtime error|fatal error|goroutine [0-9]' /tmp/qs.err; then
            echo "FAIL: keelix scan crashed on Linux"; exit 1
          fi
          grep -q "Posture Score" /tmp/qs.out || { echo "FAIL: no Posture Score in output"; exit 1; }
          echo "OK: whole-box quickstart ran clean on Linux"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # gitleaks needs full history to scan commits
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache: true
      - name: govulncheck (Go vulnerability DB)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec (Go static security analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=cloud ./...
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
